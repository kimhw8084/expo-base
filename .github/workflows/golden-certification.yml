name: Expo Base Golden Certification

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: expo-base-golden-${{ github.ref }}
  cancel-in-progress: true

jobs:
  structural:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'

      - name: Install workspace
        run: npm ci

      - name: Golden structural certification
        run: npm run golden:structural

      - name: Upload structural certification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-structural-artifacts
          path: |
            docs/ultimate-golden-capabilities.json
            docs/ultimate-golden-coverage.json
            docs/ultimate-dependency-graph.json
            golden.owner-certification.json
            test-results/visualization-benchmark.json
          if-no-files-found: ignore
          retention-days: 14

  mobile:
    needs: structural
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'

      - name: Install workspace
        run: npm ci

      - name: Install mobile browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Mobile-browser parity certification
        run: npm run mobile:verify

      - name: Upload mobile certification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-mobile-artifacts
          path: |
            test-results/mobile
            test-results/mobile-report
            apps/reference/dist
          if-no-files-found: ignore
          retention-days: 14

  golden:
    needs: structural
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'

      - name: Install workspace
        run: npm ci

      - name: Install Golden browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Golden semantic, visual, and performance certification
        run: npm run golden:verify

      - name: Upload Golden certification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-certification-artifacts
          path: |
            test-results
            playwright-report
            apps/reference/dist
          if-no-files-found: ignore
          retention-days: 14
